server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lifeos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:25MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:30MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

logging:
  level:
    root: INFO
    com.lifeos: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
