server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lifeos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:25MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:30MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

logging:
  level:
    root: INFO
    com.lifeos: DEBUG
    org.flywaydb: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

storage:
  local:
    upload-dir: ${STORAGE_UPLOAD_DIR:./storage/uploads}
  max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:26214400} # 25 MB
  allowed-mime-types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/msword
    - text/plain
    - image/jpeg
    - image/png
    - image/webp

lifeos:
  rag:
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:mock}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
      dimension: 1536
    retrieval:
      lexical-top-k: 20
      vector-top-k: 20
      rrf-constant-k: 60
      lexical-weight: 1.0
      vector-weight: 1.0
      min-similarity-threshold: 0.40
      min-fused-score-threshold: 0.15
      min-rerank-score-threshold: 0.20
      rerank-limit: 10
      max-context-chars: 16000
  assistant:
    llm:
      provider: ${LIFEOS_LLM_PROVIDER:mock}
      model: ${LIFEOS_LLM_MODEL:gpt-4o-mini}
      api-key: ${LIFEOS_LLM_API_KEY:}
      base-url: ${LIFEOS_LLM_BASE_URL:https://api.openai.com/v1}
      temperature: 0.1
      max-tokens: 1024
      timeout-ms: 20000
      max-retries: 2
    context:
      max-retrieved-chunks: 5
      max-chunk-chars: 2500
      max-context-tokens: 3000
      max-history-messages: 6
      max-history-tokens: 1500

